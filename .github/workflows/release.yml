name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify project
        run: make check
      - name: Build release assets
        run: make release-artifacts VERSION="$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.ipa dist/*.tar.gz dist/checksums.txt
          --verify-tag
          --title "EvilCorp iOS $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
